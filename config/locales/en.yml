en:
  app:
    name: Learning Log

  activerecord:
    attributes:
      family:
        name: Name
      child:
        name: Name
      user:
        name: Name
        email_address: Email address
        password: Password
    errors:
      models:
        user:
          attributes:
            email_address:
              taken: is already used by another account
        membership:
          attributes:
            user:
              already_in_a_family: is already in a family
            base:
              last_member: Someone has to stay in the family, so the last grown-up can't leave.

  layouts:
    account_menu:
      family: Your family
      sign_out: Sign out
    signed_out_nav:
      sign_in: Sign in
      register: Create an account

  shared:
    password_field:
      show: Show
      hide: Hide
    share_link:
      share: Share link
      copy: Copy link
      copied: Copied

  home:
    show:
      heading: A shared notebook for home education
      intro: Log what the children got up to with a photo and a line or two. Look back to see what they're into, what's working and what isn't. Free, open source and no email.
      register: Get started
      sign_in: Sign in

  sessions:
    new:
      title: Sign in
      heading: Sign in
      email_address: Email address
      password: Password
      submit: Sign in
      forgotten: Forgotten your password? Ask someone else in your family to make you a new sign-in link.
      new_here: New here?
      register: Create an account
    create:
      invalid: That email address and password don't match. Check for typos and try again.
      rate_limited: Too many tries. Please wait a few minutes and try again.

  registrations:
    new:
      title: Create an account
      heading: Create an account
      intro: It's free, and it takes a minute.
      name: What should we call you?
      name_hint: This is how the rest of your family will see you in the log. A first name works well.
      email_address: Email address
      email_address_hint: You'll use this to sign in. We'll never send you email.
      password: Choose a password
      password_hint: At least 8 characters. Your phone or browser can remember it for you.
      submit: Create my account
      have_account: Already have an account?
      sign_in: Sign in
    create:
      rate_limited: Too many accounts made from here recently. Please wait a few minutes and try again.

  passwords:
    edit:
      title: Choose a new password
      heading: Hello again, %{name}
      intro: Choose a new password and you'll be signed in.
      email_address: Email address
      password: New password
      password_hint: At least 8 characters. Your phone or browser can remember it for you.
      submit: Save and sign in
    update:
      rate_limited: Too many tries. Please wait a few minutes and try again.
    expired:
      title: Link expired
      heading: This link has expired
      intro: Sign-in links work once and only for three days. Ask someone else in your family to make you a new one.

  families:
    new:
      title: Start your family
      heading: Start your family
      intro: The log belongs to your family. You can invite the other grown-ups once it's set up.
      name: Family name
      name_hint: Something like "The Dawsons". Anyone you invite will see it.
      submit: Start
      invited: Been sent an invite? Open the link to join your family instead.
    create:
      started: Your family's ready. Who's being home educated?
    show:
      kicker: Your family
      rename: Rename
      children: Children
      edit: Edit
      edit_child: Edit %{name}
      no_children: No children yet.
      add_child: Add a child
      grown_ups: Grown-ups
      you: You
      leave: Leave
      leave_confirm: Leave %{family}? You'll stop seeing the log, and someone will need to invite you back.
      sign_in_link: Sign-in link
      remove: Remove
      remove_confirm: Remove %{name} from the family? They'll stop seeing the log.
      invite: Invite a grown-up
    edit:
      title: Rename your family
      heading: Rename your family
      name: Family name
      submit: Save
      cancel: Cancel
    update:
      renamed: Saved.
    children:
      form:
        name: Name
        name_hint: Whatever you call them day to day.
        add: Add
        save: Save
        cancel: Cancel
      new:
        title: Add a child
        heading: Add a child
        intro: Add each child you're home educating. You can add more later.
      edit:
        title: "%{name}"
        heading: "%{name}"
        remove: Remove %{name}
        remove_confirm: Remove %{name} from the family?
      create:
        added: Added %{name}.
      update:
        renamed: Saved %{name}.
      destroy:
        removed: Removed %{name}.
    memberships:
      destroy:
        removed: "%{name} has left the family."
      sign_in_links:
        show:
          title: Sign-in link
          heading: A sign-in link for %{name}
          intro: If %{name} has forgotten their password, send them this link. It lets them choose a new one and signs them in.
          share_title: Your sign-in link
          expiry: It works once, for three days. Anyone with the link can get into the account, so send it straight to them.
    invitations:
      show:
        title: Invite a grown-up
        heading: Invite a grown-up
        intro: Send this link to another grown-up in %{family}. Once they join, they can see everything in the log and add to it.
        share_title: Join %{family} on %{app}
        expiry: The link works for seven days. Anyone with it can join, so only send it to people you trust.

  joins:
    rate_limited: Too many tries. Please wait a few minutes and try again.
    show:
      title: Join %{family}
      invited: You've been invited to join
      members: With %{names}
      register: Create an account
      sign_in: Sign in
      already_member: You're already in this family.
      open: Open the log
      in_another_family: You're already in %{family}. For now, each person can only be in one family.
      join: Join %{family}
    create:
      joined: Welcome to %{family}.
    expired:
      title: Invite expired
      heading: This invite has expired
      intro: Invite links work for seven days. Ask whoever sent it to make you a new one.
